<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Rock Paper Scissors Game</h1>

    <div class="choices">
        <div class="choice" id="rock">
            <img src="rock.jpeg" alt="Rock">
        </div>

        <div class="choice" id="paper">
            <img src="paper.jpeg" alt="Paper">
        </div>

        <div class="choice" id="scissors">
            <img src="scissors.jpeg" alt="Scissors">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>

    <div class="choices-display">
    <p id="user-choice">Your choice: -</p>
    <p id="comp-choice">Computer choice: -</p>
</div>

<!-- Add this inside your body, wherever suitable -->
<button id="play-again">Play Again</button>

    <!-- IMPORTANT: keep this at bottom -->
    <script src="scipt.js"></script>

</body>
</html>
